<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elora — Timeless Fashion for All Generations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#5b0e2d;--maroon-d:#3f0920;--maroon-l:#7b1f45;
  --gold:#c49a5a;--gold-l:#e8cd96;--gold-d:#9c7438;
  --cream:#faf5ee;--cream-2:#f3eadf;--card:#fffdf9;
  --ink:#2a171d;--muted:#7b6a6f;--line:#eadfcf;
  --ok:#2f6b3f;--err:#a3242f;
  --serif:"Playfair Display",Georgia,serif;--caps:"Cinzel","Playfair Display",serif;--sans:"Jost",system-ui,sans-serif;
  --r:14px;--shadow:0 10px 30px -12px rgba(63,9,32,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{overflow-x:clip;margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--maroon);margin:0;line-height:1.15}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* announcement */
.ann{background:var(--maroon-d);color:var(--gold-l);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;text-align:center;height:38px;display:flex;align-items:center;justify-content:center;gap:12px;overflow:hidden}
.ann .msg{transition:opacity .4s}
.ann .dot{color:var(--gold)}

/* header */
header.top{background:var(--cream);position:sticky;top:0;z-index:40;border-bottom:1px solid var(--line)}
.hbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:76px}
.hnav{display:flex;gap:24px;font-size:12px;letter-spacing:.12em;white-space:nowrap;text-transform:uppercase;font-weight:500}
.hnav a{padding:6px 0;border-bottom:1px solid transparent;transition:border-color .2s,color .2s}
.hnav a:hover,.hnav a.on{color:var(--maroon);border-color:var(--gold)}
.hnav.r{justify-content:flex-start}
.logo{display:block;width:96px;height:96px;margin-top:22px;border-radius:50%;box-shadow:0 0 0 3px var(--cream),0 0 0 4px var(--gold),0 12px 26px -10px rgba(63,9,32,.5);overflow:hidden;background:var(--maroon);position:relative;z-index:2;transition:transform .3s}
.logo:hover{transform:scale(1.03)}
.logo img{width:100%;height:100%;object-fit:cover}
.hicons{display:flex;justify-content:flex-end;gap:6px;align-items:center}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;position:relative;transition:background .2s}
.ib:hover{background:var(--cream-2)}
.badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--maroon);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.badge:empty,.badge[data-n="0"]{display:none}
.menu-btn{display:none}
.hleft{display:flex;align-items:center;gap:26px}
.adminpill{font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--gold);color:var(--maroon);border-radius:20px;padding:6px 12px;margin-right:6px;display:none}
.adminpill.show{display:inline-block}
.adminpill:hover{background:var(--maroon);color:var(--gold-l)}

/* mobile drawer */
.scrim{position:fixed;inset:0;background:rgba(42,23,29,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;width:min(420px,92vw);background:var(--cream);z-index:90;transition:transform .3s ease;display:flex;flex-direction:column}
.drawer.left{left:0;transform:translateX(-102%)}
.drawer.right{right:0;transform:translateX(102%)}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dhead h3{font-size:22px}
.dbody{flex:1;overflow:auto;padding:12px 20px}
.dfoot{border-top:1px solid var(--line);padding:16px 20px;background:var(--card)}
.mnav a{display:flex;justify-content:space-between;align-items:center;padding:15px 2px;border-bottom:1px solid var(--line);font-size:15px;letter-spacing:.08em;text-transform:uppercase}

/* search */
.search-panel{position:fixed;left:0;right:0;top:0;background:var(--cream);z-index:95;padding:22px 0 28px;box-shadow:var(--shadow);transform:translateY(-105%);transition:transform .3s}
.search-panel.on{transform:none}
.sbox{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--maroon);padding:6px 2px}
.sbox input{flex:1;border:0;background:transparent;font-family:var(--serif);font-size:24px;outline:none;padding:6px 0}
.sres{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:16px;max-height:60vh;overflow:auto}
.sres a{display:flex;gap:12px;align-items:center;padding:8px;border-radius:10px}
.sres a:hover{background:var(--cream-2)}
.sres img{width:52px;height:68px;object-fit:cover;border-radius:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 28px;border-radius:6px;font-size:13.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;transition:transform .15s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-gold{background:linear-gradient(180deg,#efd7a6,#d9b878);color:var(--maroon-d);box-shadow:0 6px 18px -8px rgba(156,116,56,.7)}
.btn-gold:hover{background:linear-gradient(180deg,#f3dfb4,#e0c085)}
.btn-maroon{background:var(--maroon);color:#fff}
.btn-maroon:hover{background:var(--maroon-l)}
.btn-line{border:1px solid var(--maroon);color:var(--maroon);background:transparent}
.btn-line:hover{background:var(--maroon);color:#fff}
.btn-wa{background:#1f8f4e;color:#fff}
.btn-wa:hover{background:#18763f}
.btn-sm{height:38px;padding:0 16px;font-size:12px}
.btn[disabled],.btn.disabled{opacity:.45;pointer-events:none}
.block{width:100%}

/* hero */
.hero{position:relative;background:var(--maroon-d);overflow:hidden}
.slides{position:relative;height:clamp(460px,58vw,600px)}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:1.05fr 1fr;opacity:0;transition:opacity .9s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide .txt{display:flex;flex-direction:column;justify-content:center;padding:0 7vw 0 max(20px,calc((100vw - 1240px)/2 + 20px));color:var(--cream);position:relative;
  background:radial-gradient(120% 90% at 0% 0%,rgba(196,154,90,.18),transparent 55%),linear-gradient(135deg,var(--maroon) 0%,var(--maroon-d) 100%)}
.slide .txt:after{content:"";position:absolute;right:-1px;top:0;bottom:0;width:120px;background:linear-gradient(90deg,transparent,var(--maroon-d));z-index:1;pointer-events:none;opacity:.0}
.kicker{font-family:var(--caps);letter-spacing:.32em;text-transform:uppercase;font-size:13px;color:var(--gold-l)}
.slide h1,.slide h2.ht{font-size:clamp(40px,5.4vw,72px);color:#fff7ee;font-weight:500;margin:14px 0 10px;letter-spacing:-.01em}
.slide .sub{font-family:var(--caps);letter-spacing:.3em;text-transform:uppercase;color:var(--gold-l);font-size:13px;margin-bottom:30px}
.slide .pic{position:relative}
.slide .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%}
.slide .pic:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--maroon-d) 0%,transparent 22%);z-index:1}
.ornament{display:flex;align-items:center;gap:10px;color:var(--gold);margin:4px 0}
.ornament:before,.ornament:after{content:"";height:1px;width:46px;background:currentColor;opacity:.6}
.harrow{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,253,249,.92);display:grid;place-items:center;z-index:5;box-shadow:var(--shadow)}
.harrow.l{left:18px}.harrow.r{right:18px}
.dots{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
.dots button{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots button.on{background:var(--gold-l);width:26px;border-radius:5px}

/* sections */
section.s{padding:64px 0}
.sh{text-align:center;margin-bottom:34px}
.sh h2{font-size:clamp(30px,3.6vw,42px)}
.sh p{color:var(--muted);margin:8px 0 0}
.flor{display:flex;justify-content:center;align-items:center;gap:12px;color:var(--gold);margin-top:10px}
.flor:before,.flor:after{content:"";width:60px;height:1px;background:var(--gold);opacity:.7}
.flor svg{width:16px;height:16px;fill:var(--gold)}

/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.cat{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;background:var(--cream-2);box-shadow:var(--shadow)}
.cat img{width:100%;height:100%;object-fit:cover;object-position:center 20%;transition:transform .6s}
.cat:hover img{transform:scale(1.05)}
.cat .lab{position:absolute;left:0;right:0;bottom:0;padding:50px 16px 16px;background:linear-gradient(transparent,rgba(42,10,22,.82));color:#fff;display:flex;justify-content:space-between;align-items:flex-end;font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.cat .lab small{display:block;text-transform:none;letter-spacing:0;font-weight:300;opacity:.85;font-size:12.5px;margin-top:2px}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 20px}
.card{display:flex;flex-direction:column;position:relative}
.card>.heart{position:absolute;top:10px;right:10px}
.card .ph{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:var(--cream-2)}
.card .ph img{width:100%;height:100%;object-fit:cover;object-position:center 18%;transition:transform .6s,opacity .4s}
.card .ph img.alt{position:absolute;inset:0;opacity:0}
.card:hover .ph img.main{transform:scale(1.04)}
.card:hover .ph img.alt{opacity:1}
.heart{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,253,249,.92);display:grid;place-items:center;z-index:2}
.heart svg{width:18px;height:18px}
.heart.on svg{fill:var(--maroon);stroke:var(--maroon)}
.tag{position:absolute;top:12px;left:12px;background:var(--maroon);color:var(--gold-l);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:3px;z-index:2}
.tag.sale{background:var(--gold);color:var(--maroon-d)}
.tag.oos{background:#555;color:#fff}
.card .meta{padding:12px 2px 0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .nm{font-size:15px;line-height:1.35;margin-bottom:4px}
.price{font-weight:600;font-size:17px;color:var(--ink)}
.price s{color:var(--muted);font-weight:400;font-size:.85em;margin-left:6px}
.swatches{display:flex;gap:6px;margin:10px 2px 0}
.sw{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.qadd{width:42px;height:42px;flex:none;border-radius:8px;background:var(--maroon);color:#fff;display:grid;place-items:center;transition:background .2s}
.qadd:hover{background:var(--maroon-l)}
.qadd svg{width:19px;height:19px}

/* how to order */
.how{background:var(--maroon);color:var(--cream);position:relative;overflow:hidden}
.how .sh h2{color:#fff7ee}.how .sh p{color:var(--gold-l)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:st}
.step{background:rgba(255,255,255,.05);border:1px solid rgba(232,205,150,.25);border-radius:var(--r);padding:26px 22px}
.step .n{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:20px;color:var(--gold-l);margin-bottom:14px}
.step h3{color:#fff7ee;font-size:20px;margin-bottom:6px}
.step p{margin:0;color:rgba(250,245,238,.78);font-size:14.5px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:30px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.trust>div{display:flex;gap:12px;align-items:center;font-size:14px}
.trust svg{color:var(--gold-d);width:30px;height:30px;flex:none}
.trust b{display:block;font-weight:500;color:var(--maroon)}
.trust span{color:var(--muted);font-size:13px}

/* breadcrumbs, shop */
.crumbs{font-size:13px;color:var(--muted);padding:22px 0 0}
.crumbs a:hover{color:var(--maroon)}
.crumbs .sep{margin:0 8px}
.shophead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:10px 0 22px}
.shophead h1{font-size:clamp(34px,4.5vw,52px)}
.shophead p{margin:6px 0 0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:30px;padding:8px 16px;font-size:13.5px;transition:all .2s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.sel{height:42px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 12px;font-size:14px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h3{margin-bottom:8px}

/* product page */
.pdp{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;padding:20px 0 40px}
.gal{display:grid;grid-template-columns:84px 1fr;gap:12px;align-self:start;position:sticky;top:100px}
.thumbs{display:flex;flex-direction:column;gap:10px}
.thumbs button{border-radius:8px;overflow:hidden;aspect-ratio:3/4;border:2px solid transparent;opacity:.75}
.thumbs button.on{border-color:var(--maroon);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.mainimg{position:relative;border-radius:var(--r);overflow:hidden;background:var(--cream-2);aspect-ratio:3/4;cursor:zoom-in}
.mainimg img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.pinfo h1{font-size:clamp(28px,3vw,38px);margin:4px 0 12px}
.pinfo .price{font-size:26px}
.save{display:inline-block;margin-left:10px;background:var(--cream-2);color:var(--maroon);font-size:12px;padding:3px 8px;border-radius:4px;vertical-align:middle;font-weight:500}
.opt{margin-top:24px}
.opt .lbl{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
.opt .lbl b{color:var(--ink);font-weight:500;letter-spacing:.02em;text-transform:none;font-size:14.5px;margin-left:6px}
.colors{display:flex;gap:12px;flex-wrap:wrap}
.cbtn{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.1);position:relative}
.cbtn.on{box-shadow:0 0 0 2px var(--cream),0 0 0 4px var(--maroon)}
.sizes{display:flex;gap:10px;flex-wrap:wrap}
.sbtn{min-width:56px;height:46px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:14.5px;transition:all .15s}
.sbtn:hover{border-color:var(--maroon)}
.sbtn.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.link{color:var(--maroon);text-decoration:underline;text-underline-offset:3px;font-size:13px;text-transform:none;letter-spacing:0}
.buyrow{display:flex;gap:12px;margin-top:26px;align-items:stretch}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--card);height:50px}
.qty button{width:42px;height:100%;font-size:20px;color:var(--muted)}
.qty span{min-width:28px;text-align:center;font-weight:500}
.wbtn{width:50px;height:50px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;background:var(--card);flex:none}
.wbtn.on svg{fill:var(--maroon);stroke:var(--maroon)}
.err-msg{color:var(--err);font-size:13.5px;margin-top:8px;min-height:1px}
.perks{display:grid;gap:10px;margin:22px 0 4px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:14px}
.perks div{display:flex;gap:10px;align-items:center}
.perks svg{width:19px;height:19px;color:var(--gold-d)}
.acc{border-top:1px solid var(--line);margin-top:22px}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;padding:17px 2px;display:flex;justify-content:space-between;align-items:center;font-size:15.5px}
.acc summary::-webkit-details-marker{display:none}
.acc summary:after{content:"+";font-size:22px;color:var(--muted);font-weight:300}
.acc details[open] summary:after{content:"−"}
.acc .ac{padding:0 2px 18px;color:#4d3a40;font-size:14.5px;white-space:pre-line}
.desc{color:#4d3a40;margin:16px 0 0}

/* cart */
.citem{display:grid;grid-template-columns:76px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.citem img{width:76px;height:100px;object-fit:cover;border-radius:8px;object-position:center 15%}
.citem .nm{font-size:14.5px;line-height:1.35}
.citem .v{color:var(--muted);font-size:13px;margin-top:2px}
.citem .qty{height:34px;margin-top:8px;width:max-content}
.citem .qty button{width:32px;font-size:16px}
.rm{color:var(--muted);font-size:12.5px;text-decoration:underline;margin-top:6px}
.tot{display:flex;justify-content:space-between;margin:4px 0;font-size:14.5px}
.tot.big{font-size:18px;font-weight:600;margin-top:10px;color:var(--maroon)}
.freebar{background:var(--cream-2);border-radius:20px;height:6px;overflow:hidden;margin:8px 0 4px}
.freebar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--maroon))}
.freemsg{font-size:13px;color:var(--muted)}

/* checkout */
.co{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;padding:10px 0 60px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.panel h2{font-size:26px;margin-bottom:6px}
.panel .hint{color:var(--muted);font-size:14px;margin:0 0 20px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.f{display:flex;flex-direction:column;gap:6px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{height:48px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 14px;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
.f textarea{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(196,154,90,.18)}
.f.bad input,.f.bad textarea{border-color:var(--err)}
.f .em{color:var(--err);font-size:12.5px;display:none}
.f.bad .em{display:block}
.sumi{display:grid;grid-template-columns:58px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);font-size:14px;align-items:center}
.sumi img{width:58px;height:74px;object-fit:cover;border-radius:6px;object-position:center 15%}
.wa-note{display:flex;gap:12px;background:#eef7f0;border:1px solid #cfe6d6;border-radius:10px;padding:14px 16px;font-size:14px;color:#24502f;margin:18px 0}
.wa-note svg{flex:none;width:22px;height:22px;color:#1f8f4e}
.done{max-width:640px;margin:40px auto 70px;text-align:center}
.done .tick{width:74px;height:74px;border-radius:50%;background:var(--maroon);color:var(--gold-l);display:grid;place-items:center;margin:0 auto 18px}
.msgbox{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;font-size:13.5px;white-space:pre-wrap;max-height:300px;overflow:auto;margin:16px 0}

/* footer */
footer{background:var(--maroon-d);color:rgba(250,245,238,.85);position:relative;overflow:hidden;margin-top:30px}
.fgridf{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:30px;padding:54px 0 40px}
footer h4{font-family:var(--serif);font-weight:500;color:#fff7ee;font-size:20px;margin:0 0 14px}
footer a:hover{color:var(--gold-l)}
footer ul{list-style:none;padding:0;margin:0;display:grid;gap:9px;font-size:14.5px}
.flogo{width:110px;height:110px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--gold)}
.ftag{font-family:var(--caps);letter-spacing:.24em;color:var(--gold-l);font-size:12px;text-transform:uppercase;margin-top:14px;line-height:1.8}
.social{display:flex;gap:10px;margin-top:6px}
.social a{width:40px;height:40px;border-radius:50%;border:1px solid rgba(232,205,150,.4);display:grid;place-items:center}
.social a:hover{background:var(--gold);color:var(--maroon-d)}
.fbot{border-top:1px solid rgba(232,205,150,.2);padding:18px 0;font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:rgba(250,245,238,.6)}
.lotus{position:absolute;opacity:.08;pointer-events:none;color:var(--gold-l)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(42,23,29,.55)}
.modal.on{display:flex}
.mbox{background:var(--cream);border-radius:var(--r);max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:26px;box-shadow:var(--shadow);position:relative}
.mbox.wide{max-width:900px}
.mclose{position:absolute;right:14px;top:14px}
.zoom .mbox{padding:0;max-width:min(90vw,700px);background:#000}
.zoom img{width:100%;max-height:90vh;object-fit:contain}
table.sg{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
table.sg th,table.sg td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:center}
table.sg th{color:var(--maroon);font-weight:500}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;z-index:150;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.note{font-size:13px;color:var(--muted)}
.banner{background:#fff4dd;border:1px solid #f0d9a6;color:#6b4a12;padding:10px 14px;border-radius:8px;font-size:13.5px;margin:14px 0}

/* admin */
.adm{padding:24px 0 60px}
.adm-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{padding:12px 18px;font-size:14px;letter-spacing:.06em;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{border-color:var(--maroon);color:var(--maroon);font-weight:500}
.alist{display:grid;gap:10px}
.arow{display:grid;grid-template-columns:56px 1fr auto auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.arow img{width:56px;height:70px;object-fit:cover;border-radius:6px;object-position:center 15%;background:var(--cream-2)}
.arow .t{font-weight:500}
.arow .s{font-size:13px;color:var(--muted)}
.pill{font-size:11px;padding:3px 8px;border-radius:10px;background:var(--cream-2);color:var(--maroon);margin-left:6px;letter-spacing:.04em}
.pill.off{background:#eee;color:#666}
.imgs{display:flex;gap:10px;flex-wrap:wrap}
.imgs .it{position:relative;width:92px}
.imgs .it img{width:92px;height:118px;object-fit:cover;border-radius:8px;object-position:center 15%}
.imgs .it .ctl{display:flex;justify-content:space-between;margin-top:4px}
.imgs .it .ctl button{font-size:12px;padding:2px 6px;border-radius:4px;background:var(--cream-2)}
.upl{width:92px;height:118px;border:1.5px dashed var(--gold);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--maroon);cursor:pointer;padding:6px}
.upl input{display:none}
.crow{display:grid;grid-template-columns:1fr 54px 1fr 34px;gap:8px;align-items:center;margin-bottom:8px}
.crow input[type=color]{height:44px;width:54px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
.crow input,.crow select{height:44px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.presets button{font-size:12px;border:1px solid var(--line);border-radius:14px;padding:4px 10px;background:#fff}
.tog{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--maroon)}
.hero-ed{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:12px}
.hero-ed img{width:110px;height:140px;object-fit:cover;border-radius:8px}
.loading{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* responsive */
@media (max-width:1240px){
  .hnav{display:none}
  .menu-btn{display:grid}
}
@media (max-width:1080px){
  .grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:900px){
  .hbar{height:66px}
  .logo{width:78px;height:78px;margin-top:18px}
  .slides{height:auto;aspect-ratio:4/5;max-height:640px}
  .slide{grid-template-columns:1fr}
  .slide .pic{position:absolute;inset:0}
  .slide .pic:before{background:linear-gradient(0deg,rgba(42,8,22,.95) 0%,rgba(42,8,22,.7) 38%,rgba(42,8,22,.1) 62%,transparent 75%)}
  .harrow{display:none}
  .kicker{font-size:11px;letter-spacing:.24em}
  .slide .txt{position:relative;z-index:2;background:none;justify-content:flex-end;padding:0 24px 64px}
  .slide h1,.slide h2.ht{font-size:38px;margin:8px 0 6px}
  .slide .sub{margin-bottom:20px;font-size:11.5px}
  .harrow{width:38px;height:38px}
  .grid{grid-template-columns:repeat(2,1fr);gap:22px 12px}
  .steps{grid-template-columns:repeat(2,1fr)}
  .trust{grid-template-columns:repeat(2,1fr)}
  .pdp{grid-template-columns:1fr;gap:24px}
  .gal{position:static;grid-template-columns:1fr}
  .thumbs{flex-direction:row;order:2;overflow-x:auto}
  .thumbs button{width:70px;flex:none}
  .co{grid-template-columns:1fr}
  .co .sumcol{order:-1}
  .fgridf{grid-template-columns:1fr 1fr}
  .cats{grid-template-columns:repeat(2,1fr);gap:12px}
}
@media (max-width:560px){
  section.s{padding:46px 0}
  .wrap{padding:0 14px}
  .card .nm{font-size:13.5px}
  .price{font-size:15px}
  .qadd{width:36px;height:36px}
  .fgrid{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .fgridf{grid-template-columns:1fr}
  .panel{padding:20px}
  .ann{font-size:11px;letter-spacing:.1em}
  .arow{grid-template-columns:48px 1fr auto}
  .arow .hide-s{display:none}
  .buyrow{flex-wrap:wrap}
  .buyrow .btn{flex:1}
  .hero-ed{grid-template-columns:1fr}
}

<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SEED=window.ELORA_SEED;
const store={
  get(k,d){try{const v=localStorage.getItem("elora_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("elora_"+k,JSON.stringify(v))}catch(e){}}
};
const S={
  settings:{...SEED.settings},categories:SEED.categories.slice(),products:SEED.products.slice(),
  live:false,dbReady:false,isAdmin:false,
  cart:store.get("cart",[]),wish:store.get("wish",[]),
  shopSort:"featured",heroIdx:0,adminTab:"products",lastOrder:null
};
let db=null,assets=null,user=null;
const cur=()=>S.settings.currency||"£";
const money=n=>cur()+(Number(n)||0).toFixed(2);
const imgOf=p=>(p.images&&p.images[0])||"img/logo.jpg";
const catById=id=>S.categories.find(c=>c.id===id);
const prodById=id=>S.products.find(p=>p.id===id);
const sortedCats=()=>S.categories.slice().sort((a,b)=>(a.order??99)-(b.order??99));
const visibleProducts=()=>S.products.filter(p=>p.hidden!==true).sort((a,b)=>(a.order??999)-(b.order??999));
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"item";
const uid=s=>slug(s)+"-"+Math.random().toString(36).slice(2,6);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2400)}
const icon=(n,c="i")=>`<svg class="${c}"><use href="#i-${n}"/></svg>`;
function waNumber(){return String(S.settings.whatsapp||"").replace(/[^0-9]/g,"")}

/* ---------- live data ---------- */
async function initLive(){
  try{
    if(!window.claude||!window.claude.use) return;
    user=await claude.use("user");
    if(user){try{S.isAdmin=!!(await user.canEdit())}catch(e){}}
    db=await claude.use("db");
    if(S.isAdmin){try{assets=await claude.use("assets")}catch(e){}}
    $("#adminPill").classList.toggle("show",S.isAdmin);
    renderChrome();
    if(!db) return;
    let got={p:false,c:false,s:false},tmp={p:null,c:null};
    const timer=setTimeout(()=>{if(!S.dbReady&&S.isAdmin)toast("Store data is slow to load…")},10000);
    const apply=()=>{
      if(!(got.p&&got.c&&got.s))return;
      clearTimeout(timer);S.dbReady=true;
      // Use live data once the store has been set up; otherwise keep the starter catalogue on show.
      if(tmp.p.length||tmp.c.length){S.products=tmp.p;S.categories=tmp.c;S.live=true}
      else {S.live=false}
      renderChrome();route(true);
    };
    db.collection("products").onSnapshot(s=>{tmp.p=s.docs.filter(d=>d.exists).map(d=>({...d.data(),id:d.id}));got.p=true;apply()},e=>{got.p=true;tmp.p=tmp.p||[];apply()});
    db.collection("categories").onSnapshot(s=>{tmp.c=s.docs.filter(d=>d.exists).map(d=>({...d.data(),id:d.id}));got.c=true;apply()},e=>{got.c=true;tmp.c=tmp.c||[];apply()});
    db.doc("config/site").onSnapshot(d=>{if(d.exists)S.settings={...SEED.settings,...d.data()};got.s=true;apply()},e=>{got.s=true;apply()});
  }catch(e){console.warn(e)}
}

/* ---------- chrome ---------- */
function renderChrome(){
  const cats=sortedCats();
  const navItems=[["shop","Shop All"],...cats.map(c=>["c-"+c.id,c.name])];
  const half=Math.ceil(navItems.length/2);
  const h=location.hash.slice(1);
  const link=([k,t])=>`<a href="#${esc(k)}" class="${h===k?"on":""}">${esc(t)}</a>`;
  $("#navL").innerHTML=navItems.slice(0,half).map(link).join("");
  $("#navR").innerHTML=navItems.slice(half).map(link).join("");
  $("#mnav").innerHTML=[["","Home"],["shop","Shop All"],...cats.map(c=>["c-"+c.id,c.name]),["wishlist","Wishlist"],["how-to-order","How to Order"],["policies","Delivery & Returns"]].concat(S.isAdmin?[["admin","Admin Panel"]]:[]).map(([k,t])=>`<a href="#${esc(k)}">${esc(t)}${icon("r")}</a>`).join("");
  $("#fcats").innerHTML=`<li><a href="#shop">Shop all</a></li>`+cats.map(c=>`<li><a href="#c-${esc(c.id)}">${esc(c.name)}</a></li>`).join("");
  const st=S.settings,wa=waNumber();
  $("#fcontact").innerHTML=(wa?`<li><a href="https://wa.me/${wa}" target="_blank" rel="noopener">${icon("wa")} <span style="vertical-align:5px">+${esc(wa)}</span></a></li>`:"")+
    (st.email?`<li><a href="mailto:${esc(st.email)}">${icon("mail")} <span style="vertical-align:5px">${esc(st.email)}</span></a></li>`:"")+
    (st.location?`<li>${icon("pin")} <span style="vertical-align:5px">${esc(st.location)}</span></li>`:"");
  $("#fsocial").innerHTML=(st.instagram?`<a href="${esc(safeUrl(st.instagram))}" target="_blank" rel="noopener" aria-label="Instagram">${icon("ig")}</a>`:"")+(wa?`<a href="https://wa.me/${wa}" target="_blank" rel="noopener" aria-label="WhatsApp">${icon("wa")}</a>`:"");
  $("#fadmin").innerHTML=S.isAdmin?`<a href="#admin" style="color:var(--gold-l)">Admin panel</a>`:"Made with love in the UK";
  $("#yr").textContent=new Date().getFullYear();
  updateCounts();
  startAnn();
}
function safeUrl(u){u=String(u||"").trim();return /^https?:\/\//i.test(u)?u:(u?"https://"+u.replace(/^\/+/,""):"#")}
function startAnn(){
  const list=(S.settings.announcements||[]).filter(Boolean);if(!list.length)return;
  let i=0;$("#annMsg").textContent=list[0];clearInterval(startAnn.t);

function cartTotals(){
  const sub=S.cart.reduce((a,i)=>{const p=prodById(i.id);return a+(p?p.price*i.qty:0)},0);
  const free=Number(S.settings.freeOver)||0;const fee=Number(S.settings.deliveryFee)||0;
  const ship=sub===0?0:(free&&sub>=free?0:fee);
  return {sub,ship,total:sub+ship,free};
}

function orderMessage(ref,d){
  const t=cartTotals();
  const lines=S.cart.map((i,n)=>{const p=prodById(i.id);return `${n+1}. ${p.name}${i.color?` — ${i.color}`:""}${i.size?` — ${p.sizeLabel||"Size"} ${i.size}`:""} × ${i.qty} = ${money(p.price*i.qty)}`});
  return [
    `*New order — ELORA*`,`Order ref: ${ref}`,``,`*Items*`,...lines,``,
    `Subtotal: ${money(t.sub)}`,`Delivery: ${t.ship?money(t.ship):"Free"}`,`*Total: ${money(t.total)}*`,``,
    `*Customer*`,d.name,`Phone: ${d.phone}`,d.email?`Email: ${d.email}`:null,``,
    `*Delivery address*`,d.line1,d.line2||null,[d.city,d.county].filter(Boolean).join(", "),d.postcode.toUpperCase(),d.country,
    d.notes?`\n*Notes*\n${d.notes}`:null,``,`Please send me the payment details to confirm my order. Thank you!`
  ].filter(x=>x!==null).join("\n");
}
function submitCheckout(e){
  e.preventDefault();
  const form=$("#coForm");const d={};let ok=true,first=null;
  form.querySelectorAll("[name]").forEach(el=>{d[el.name]=el.value.trim()});
  const req=["name","phone","line1","city","postcode","country"];
  form.querySelectorAll(".f").forEach(w=>w.classList.remove("bad"));
  req.forEach(k=>{let bad=!d[k];if(k==="phone"&&d[k].replace(/[^0-9]/g,"").length<7)bad=true;if(bad){ok=false;const w=form.querySelector(`[data-f="${k}"]`);w.classList.add("bad");first=first||w}});
  if(!ok){first.scrollIntoView({behavior:"smooth",block:"center"});first.querySelector("input,textarea").focus();return}
  Object.assign(coData,d);store.set("addr",{...coData,notes:""});
  const ref="ELR-"+Date.now().toString(36).toUpperCase().slice(-6);
  const msg=orderMessage(ref,d);
  S.lastOrder={ref,msg,url:`https://wa.me/${waNumber()}?text=${encodeURIComponent(msg)}`,total:cartTotals().total};
  S.cart=[];store.set("cart",S.cart);updateCounts();
  location.hash="order-sent";
}

async function shrink(file,max=1400){
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.85));}catch(e){return file}
}
async function uploadFiles(files){
  if(!assets){toast("Photo upload isn't available here");return []}
  const out=[];
  for(const f of files){try{const b=await shrink(f);const r=await assets.upload(b);out.push(r.url||("/_blob/"+r.id))}catch(e){toast("A photo couldn't be uploaded");console.warn(e)}}
  return out;
}

let lastRoute="";
function route(keepScroll){
  const h=decodeURIComponent(location.hash.slice(1));
  let html;
  if(!h||h==="home")html=vHome();
  else if(h==="shop")html=vShop(null);
  else if(h==="wishlist")html=vShop(null,"wish");
  else if(h.startsWith("c-"))html=vShop(h.slice(2));
  else if(h.startsWith("p-"))html=vProduct(h.slice(2));
  else if(h==="checkout")html=vCheckout();
  else if(h==="order-sent")html=vOrderSent();
  else if(h==="how-to-order")html=vHow();
  else if(h==="policies")html=vPolicies();
  else if(h==="admin")html=vAdmin();
  else html=vNotFound();
  $("#view").innerHTML=html;
  if(!keepScroll&&lastRoute!==h)window.scrollTo(0,0);
  lastRoute=h;
  document.querySelectorAll(".hnav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+h));
  const sortSel=$("#sortSel");if(sortSel)sortSel.onchange=e=>{S.shopSort=e.target.value;route(true)};
  const co=$("#coForm");if(co){co.onsubmit=submitCheckout;co.oninput=e=>{if(e.target.name)coData[e.target.name]=e.target.value;const w=e.target.closest(".f");if(w)w.classList.remove("bad")}}
  const sf=$("#setForm");if(sf)sf.onsubmit=saveSettings;
  const aq=$("#admQ");if(aq)aq.oninput=e=>{S.adminQ=e.target.value;const pos=e.target.selectionStart;route(true);const n=$("#admQ");n.focus();n.setSelectionRange(pos,pos)};
  if(document.querySelector(".slides"))startHero();else clearInterval(startHero.t);
}
function startHero(){clearInterval(startHero.t);startHero.t=setInterval(()=>heroGo(1),6000)}
function heroGo(d,to){
  const sl=document.querySelectorAll(".slide"),dt=document.querySelectorAll(".dots button");if(!sl.length)return;
  S.heroIdx=to!=null?to:(S.heroIdx+d+sl.length)%sl.length;
  sl.forEach((s,i)=>s.classList.toggle("on",i===S.heroIdx));dt.forEach((s,i)=>s.classList.toggle("on",i===S.heroIdx));
}

function addToCart(id,thenCheckout){
  const p=prodById(id);const st=pdpState[id]||{qty:1,color:0};
  if((p.sizes||[]).length&&!st.size){$("#sizeErr").textContent="Please choose a size";$("#sizeErr").scrollIntoView({behavior:"smooth",block:"center"});return}
  const color=(p.colors||[])[st.color];const size=(p.sizes||[]).length?st.size:"";
  const img=(color&&color.image)||imgOf(p);
  const ex=S.cart.find(i=>i.id===id&&i.size===size&&i.color===(color?color.name:""));
  if(ex)ex.qty+=st.qty;else S.cart.push({id,size,color:color?color.name:"",qty:st.qty,img});
  store.set("cart",S.cart);updateCounts();
  if(thenCheckout){location.hash="checkout"}else{renderCart();openDrawer("#cartDrawer")}
}
async function saveSettings(e){
  e.preventDefault();const f=$("#setForm");const s={...S.settings};
  f.querySelectorAll("[data-s]").forEach(el=>{const k=el.dataset.s;let v=el.value.trim();
    if(k==="announcements")v=v.split("\n").map(x=>x.trim()).filter(Boolean);
    else if(k==="deliveryFee"||k==="freeOver")v=Number(v)||0;
    else if(k==="whatsapp")v=v.replace(/[^0-9]/g,"");s[k]=v});
  s.hero=[...f.querySelectorAll("[data-hero]")].map(w=>{const h={};w.querySelectorAll("[data-h]").forEach(el=>h[el.dataset.h]=el.value.trim());return h}).filter(h=>h.image);
  try{await db.doc("config/site").set(clean(s));S.settings=s;toast("Settings saved");renderChrome()}catch(err){toast("Couldn't save: "+(err.message||err.code))}
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  const pid=(location.hash.match(/^#p-(.+)$/)||[])[1];
  switch(a){
    case "menu":openDrawer("#menuDrawer");break;
    case "cart":e.preventDefault();renderCart();openDrawer("#cartDrawer");break;
    case "search":openDrawer("#searchPanel");setTimeout(()=>$("#sInput").focus(),200);doSearch();break;
    case "closeall":closeAll();break;
    case "hero":heroGo(+t.dataset.d);startHero();break;
    case "heroTo":heroGo(0,+t.dataset.i);startHero();break;
    case "wish":e.preventDefault();toggleWish(id);break;
    case "pimg":pdpState[pid].img=+t.dataset.i;route(true);break;
    case "pcolor":{const p=prodById(pid);const st=pdpState[pid];st.color=+t.dataset.i;const im=p.colors[st.color].image;const ix=(p.images||[]).indexOf(im);if(ix>=0)st.img=ix;route(true);break}
    case "psize":pdpState[pid].size=t.dataset.s;route(true);break;
    case "pqty":{const st=pdpState[pid];st.qty=Math.max(1,Math.min(20,st.qty+(+t.dataset.d)));route(true);break}
    case "addcart":addToCart(id);break;
    case "buynow":addToCart(id,true);break;
    case "sizeguide":openModal(`<h2 style="font-size:26px">Size Guide</h2><div style="margin-top:10px">${sizeTable()}</div>`);break;
    case "zoom":{const im=t.querySelector("img");openModal(`<img src="${esc(im.getAttribute("src"))}" alt="" data-act="closemodal">`,"zoom");break}
    case "cqty":{const i=S.cart[+t.dataset.i];i.qty=Math.max(1,Math.min(20,i.qty+(+t.dataset.d)));store.set("cart",S.cart);updateCounts();renderCart();break}
    case "crm":S.cart.splice(+t.dataset.i,1);store.set("cart",S.cart);updateCounts();renderCart();break;
    case "copyorder":try{await navigator.clipboard.writeText(S.lastOrder.msg);toast("Order details copied")}catch(err){const r=document.createRange();r.selectNodeContents($("#orderMsg"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected — copy with your keyboard")}break;
    case "closemodal":closeModal();break;
    // admin
    case "settab":S.adminTab=t.dataset.tab;if(location.hash!=="#admin"){e.preventDefault();location.hash="admin"}else route(true);break;
    case "seed":await seedStore();break;
    case "newprod":edit={id:null,name:"",category:sortedCats()[0]?.id||"",price:"",images:[],colors:[],sizes:["XS","S","M","L","XL","XXL"],sizeLabel:"Size",inStock:true,isNew:true,order:S.products.length+1};openModal(productForm(edit),"wide");break;
    case "editprod":edit=JSON.parse(JSON.stringify(prodById(id)));openModal(productForm(edit),"wide");break;
    case "delprod":{const p=prodById(id);confirmBox(`Delete "${p.name}"? This can't be undone.`,async()=>{try{await db.collection("products").doc(id).delete();toast("Product deleted")}catch(err){toast("Couldn't delete")}});break}
    case "newcat":edit={id:null,name:"",order:S.categories.length+1};openModal(catForm(edit));break;
    case "editcat":edit={...catById(id)};openModal(catForm(edit));break;
    case "delcat":{const c=catById(id);const n=S.products.filter(p=>p.category===id).length;confirmBox(`Delete the "${c.name}" category?${n?` Its ${n} products will stay but won't appear under any category until you move them.`:""}`,async()=>{try{await db.collection("categories").doc(id).delete();toast("Category deleted")}catch(err){toast("Couldn't delete")}});break}
    case "imgdel":edit=readProdForm();edit.images.splice(+t.dataset.i,1);$("#mbox").innerHTML=closeBtn()+productForm(edit);break;
    case "imgmove":{edit=readProdForm();const i=+t.dataset.i,j=i+(+t.dataset.d);if(j<0||j>=edit.images.length)break;[edit.images[i],edit.images[j]]=[edit.images[j],edit.images[i]];$("#mbox").innerHTML=closeBtn()+productForm(edit);break}
    case "addcolor":edit=readProdForm();edit.colors.push({name:"New colour",hex:"#5b0e2d",image:""});$("#mbox").innerHTML=closeBtn()+productForm(edit);break;
    case "delcolor":{edit=readProdForm();const rows=[...document.querySelectorAll("#pColors .crow")];const all=rows.map(r=>({name:r.querySelector('[data-c="name"]').value,hex:r.querySelector('[data-c="hex"]').value,image:r.querySelector('[data-c="image"]').value}));all.splice(+t.dataset.i,1);edit.colors=all;$("#mbox").innerHTML=closeBtn()+productForm(edit);break}
    case "sizepre":$("#prodForm").elements.sizes.value=t.dataset.v;$("#prodForm").elements.sizeLabel.value=t.dataset.v.startsWith("32")?"Blouse size":"Size";break;
    case "heroclear":{const w=t.closest("[data-hero]");w.querySelector('[data-h="image"]').value="";const l=w.querySelector(".upl");l.style.background="";l.style.color="";l.firstChild.textContent="+ Add photo";t.remove();break}
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;const a=t.dataset.actChange;if(!a)return;
  const files=[...t.files];if(!files.length)return;
  const lab=t.closest("label");const old=lab.firstChild.textContent;lab.firstChild.textContent="Uploading…";
  const urls=await uploadFiles(files);lab.firstChild.textContent=old;if(!urls.length)return;
  if(a==="prodimg"){edit=readProdForm();edit.images=(edit.images||[]).concat(urls);$("#mbox").innerHTML=closeBtn()+productForm(edit)}
  else if(a==="catimg"){edit=readCatForm();edit.image=urls[0];$("#mbox").innerHTML=closeBtn()+catForm(edit)}
  else if(a==="heroimg"){const w=t.closest("[data-hero]");w.querySelector('[data-h="image"]').value=urls[0];lab.style.background=`url('${urls[0]}') center 20%/cover`;lab.style.color="#fff";lab.firstChild.textContent="Change photo"}
});
document.addEventListener("submit",async e=>{
  if(e.target.id==="prodForm"){
    e.preventDefault();const p=readProdForm();const err=$("#pErr");
    if(!p.name){err.textContent="Please add a product name";return}
    if(!(p.price>0)){err.textContent="Please add a price";return}
    if(!p.category){err.textContent="Please create a category first";return}
    if(!p.images.length){err.textContent="Please add at least one photo";return}
    const id=p.id||uid(p.name);const btn=$("#pSave");btn.innerHTML=`<span class="loading"></span>`;btn.disabled=true;
    try{await db.collection("products").doc(id).set(clean({...p,createdAt:p.createdAt||Date.now()}));closeModal();toast("Product saved")}
    catch(x){err.textContent="Couldn't save: "+(x.message||x.code);btn.textContent="Save product";btn.disabled=false}
  }
  if(e.target.id==="catForm"){
    e.preventDefault();const c=readCatForm();if(!c.name){$("#cErr").textContent="Please add a name";return}
    const id=c.id||slug(c.name)+(catById(slug(c.name))?"-"+Math.random().toString(36).slice(2,5):"");
    try{await db.collection("categories").doc(id).set(clean(c));closeModal();toast("Category saved")}catch(x){$("#cErr").textContent="Couldn't save: "+(x.message||x.code)}
  }
});
function doSearch(){
  const q=$("#sInput").value.trim().toLowerCase();
  const ps=visibleProducts().filter(p=>!q||(p.name+" "+(catById(p.category)?.name||"")+" "+(p.colors||[]).map(c=>c.name).join(" ")).toLowerCase().includes(q)).slice(0,q?24:6);
  $("#sRes").innerHTML=(q?"":`<div class="note" style="grid-column:1/-1">Popular right now</div>`)+(ps.map(p=>`<a href="#p-${esc(p.id)}" data-act="closeall"><img src="${esc(imgOf(p))}" alt=""><div><div>${esc(p.name)}</div><div class="price" style="font-size:14px">${money(p.price)}</div></div></a>`).join("")||`<div class="note">No matches for “${esc(q)}”.</div>`);
}
$("#sInput").addEventListener("input",doSearch);
let tx=null;document.addEventListener("touchstart",e=>{tx=e.target.closest(".slides")?e.touches[0].clientX:null},{passive:true});
document.addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40){heroGo(dx<0?1:-1);startHero()}tx=null},{passive:true});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeAll();closeModal()}});
window.addEventListener("hashchange",()=>{closeAll();closeModal();route()});

renderChrome();route();initLive();
</script>
</body>
</html>
